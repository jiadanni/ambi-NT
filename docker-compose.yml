version: '3.8'

services:
  # Ambient Intelligence Node
  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: ambient-node
    ports:
      - "${NODE_PORT:-8000}:8000"
    environment:
      # Node Configuration
      - NODE_ID=${NODE_ID}
      - NODE_PORT=8000
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-120}
      - ENABLE_DEBUG_LOGS=${ENABLE_DEBUG_LOGS:-false}

      # Encryption
      - NODE_PRIVATE_KEY=${NODE_PRIVATE_KEY}
      - NODE_PUBLIC_KEY=${NODE_PUBLIC_KEY}

      # Coordinator (Phase 2+)
      - COORDINATOR_URL=${COORDINATOR_URL:-}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-60}

    volumes:
      # Persist Ollama models
      - ollama_data:/root/.ollama
      # Mount logs directory (optional)
      - ./logs:/app/logs

    restart: unless-stopped

    networks:
      - ambient_network

    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # Web Client (nginx serving static files)
  web-client:
    image: nginx:alpine
    container_name: ambient-web-client
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./client-web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - ambient_network
    depends_on:
      - node

  # PostgreSQL Database (Phase 2+)
  postgres:
    image: postgres:15-alpine
    container_name: ambient-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ambient}
      - POSTGRES_USER=${POSTGRES_USER:-ambient}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ambient}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ambient_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambient"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Phase 2+)
  redis:
    image: redis:7-alpine
    container_name: ambient-redis
    restart: unless-stopped
    networks:
      - ambient_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Coordinator Service (Phase 2+)
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    container_name: ambient-coordinator
    ports:
      - "${COORDINATOR_PORT:-5000}:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ambient}:${POSTGRES_PASSWORD:-ambient}@postgres:5432/${POSTGRES_DB:-ambient}
      - REDIS_URL=redis://redis:6379/0
      - COORDINATOR_PORT=5000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - ENABLE_DEBUG_LOGS=${ENABLE_DEBUG_LOGS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ambient_network

  # Prometheus for metrics scraping (local observability)
  prometheus:
    image: prom/prometheus:latest
    container_name: ambient-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - ambient_network
    depends_on:
      - node

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: ambient-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - ambient_network
    depends_on:
      - prometheus

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local

networks:
  ambient_network:
    driver: bridge
