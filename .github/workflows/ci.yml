name: Ambient Intelligence CI

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r node/requirements.txt
        pip install -r coordinator/requirements.txt
        pip install -r client-cli/requirements.txt
        pip install aiohttp  # For load testing
    
    - name: Run security tests
      run: |
        pytest tests/test_security.py -v --tb=short
    
    - name: Run conversation tests
      run: |
        pytest tests/test_conversation.py -v --tb=short
    
    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --tb=short
    
    - name: Run chaos tests
      run: |
        pytest tests/test_chaos.py -v --tb=short
    
    - name: Generate coverage report
      run: |
        pip install pytest-cov
        pytest tests/ --cov=node --cov=coordinator --cov=client-cli --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check code formatting with Black
      run: |
        black --check node/ coordinator/ client-cli/ tests/ || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only node/ coordinator/ client-cli/ tests/ || true
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 node/ coordinator/ client-cli/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length is flexible.
        flake8 node/ coordinator/ client-cli/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check for known vulnerabilities with Safety
      run: |
        pip install -r node/requirements.txt
        pip install -r coordinator/requirements.txt
        safety check --json || true
    
    - name: Security scan with Bandit
      run: |
        bandit -r node/ coordinator/ client-cli/ -f json -o bandit-report.json || true
        bandit -r node/ coordinator/ client-cli/ || true
